name: tests
on: [push, pull_request]
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node test_engine.js
      - run: node test_lang.js
      - run: node test_code.js
      - run: node test_library.js
      - run: node test_version.js
