<!doctype html>
<!--
===========================================================================
File      : 1-5731n/index.html
Version   : 1.4.2
Role      : Single page of the application: markup of all screens, the whole stylesheet (inline, theme-driven) and the script tags.
Depends on: all scripts of the project
Called by : the browser (served by the portal)
Produces  : the page
Changelog : see CHANGELOG.md
===========================================================================
The stylesheet is inline on purpose: the portal web server delivers .css files as application/octet-stream,
which browsers refuse. Every colour comes from a CSS variable defined by themes.js (the :root block holds the
fallback values of the Clean light theme). Only layout and sizes are fixed here.
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self'; worker-src 'self'; manifest-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#f5f6f8">
<title>1-5+31IV</title>
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* Fallback values (= "clair" theme); themes.js replaces them at start-up. Only variables here: see THEMES.md. */
:root{--bg:#f5f6f8;--fg:#1d2330;--muted:#6a7385;--acc:#2f6fed;--btn-bg:#fff;--btn-fg:#1d2330;--btn-bd:#d6dae2;--btn-active:#e7ebf4;--btn-radius:12px;--mode-ok-bg:#e6f6ec;--mode-ok-fg:#1b7f45;--mode-ok-bd:#b5e0c4;--danger-bg:#fdecee;--danger-fg:#b4233a;--danger-bd:#f1b9c1;--mode-excl-bg:#fdecee;--mode-excl-fg:#b4233a;--board-bg:#dfe3ea;--board-radius:12px;--board-gap:3px;--cell-bg:#fff;--cell-radius:7px;--cell-bd:transparent;--cell-err:#e5484d;--cell-def-bg:#fff;--tile-bg:#fff;--tile-bd:#d9dde5;--tile-radius:8px;--tile-shadow:0 1px 2px rgba(20,32,60,.08);--tile-def-ring:2px;--glyph-font:system-ui,sans-serif;--glyph-weight:600;--glyph-stroke:3.2;--glyph-stroke-bold:4.6;--icon-stroke:2.4;--icon-stroke-big:3;--row-0:#2f6fed;--row-1:#0e9384;--row-2:#d9822b;--row-3:#7a4fe0;--row-4:#d6336c;--row-5:#4b5565;--slot-opacity:.9;--hint-bg:#fff;--hint-bd:#dde1e8;--hint-radius:6px;--hint-sym:#8a93a6;--done-opacity:.34;--hint-sep:#dde1e8;--zoom-veil:rgba(245,246,248,.9);--zoom-bg:#fff;--zoom-frame:#2f6fed;--zoom-radius:16px;--zoom-shadow:0 12px 40px rgba(20,32,60,.18);--dialog-bg:#fff;--dialog-bd:#d6dae2;--dialog-veil:rgba(29,35,48,.38);--toast-bg:#1d2330;--toast-fg:#fff;--rule:#e1e4ea;--bg-image:none;--foot-size:.72rem;--bf:none;--bw:1px;--btn-shadow:none;--ui-font:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --hi:clamp(24px,calc((100vw - 28px)/12.8),36px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--ui-font);background-image:var(--bg-image);background-attachment:fixed;background-size:cover;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.screen{display:none;position:absolute;inset:0;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom);flex-direction:column;align-items:center}
.screen.on{display:flex}
button{font:inherit;color:var(--btn-fg);background:var(--btn-bg);border:var(--bw) solid var(--btn-bd);border-radius:var(--btn-radius);padding:10px 16px;box-shadow:var(--btn-shadow);-webkit-backdrop-filter:var(--bf);backdrop-filter:var(--bf)}
button:active{background:var(--btn-active)}
button:disabled{opacity:.4}
/* button pictograms (glyphs.js) */
.ic{display:block;width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:var(--icon-stroke);stroke-linecap:round;stroke-linejoin:round}
.ic.in{display:inline-block;width:1.05em;height:1.05em;vertical-align:-.2em}
/* symbols: an <svg class="g"> in a tile; the colour comes from the row (--rc) */
.r0{--rc:var(--row-0)}.r1{--rc:var(--row-1)}.r2{--rc:var(--row-2)}.r3{--rc:var(--row-3)}.r4{--rc:var(--row-4)}.r5{--rc:var(--row-5)}
svg.g{display:block;width:100%;height:100%;color:var(--rc)}
.tile{display:block;background:var(--tile-bg);border:var(--bw) solid var(--tile-bd);border-radius:var(--tile-radius);box-shadow:var(--tile-shadow);padding:8%;aspect-ratio:1;min-width:0;min-height:0}
/* home */
#logo{display:block;flex:none;height:clamp(96px,21vh,200px);width:auto;margin:auto 0 4px}
#s-home{overflow-y:auto}
h1{font-size:2.6rem;margin:0;color:var(--acc);letter-spacing:.04em;font-weight:700;line-height:1.1}
h1 .tg{display:inline-block;width:1.1em;height:1.1em;vertical-align:-.17em;margin:0 -.13em}
.sub{margin:.2em 0 1.6em;color:var(--muted)}
.menu{display:flex;flex-direction:column;gap:12px;width:min(78vw,300px)}
.menu button{font-size:1.15rem;padding:12px}
.foot{flex:none;margin:auto 0 0;padding-top:18px;padding-bottom:10px;font-size:var(--foot-size);line-height:1.5;color:var(--muted);text-align:center;padding-left:12px;padding-right:12px}
/* game */
.bar{display:flex;align-items:center;gap:8px;width:100%;max-width:560px;padding:6px 0}
.bar button{padding:6px 14px;font-size:1.25rem;min-width:46px;min-height:44px;display:flex;align-items:center;justify-content:center}
.bar .grow{flex:1}
#g-time{font-variant-numeric:tabular-nums;font-size:1.15rem;color:var(--acc);font-weight:600}
#g-mode.chs,#z-mode.chs{background:var(--mode-ok-bg);color:var(--mode-ok-fg);border-color:var(--mode-ok-bd)}
#g-mode.excl,#z-mode.excl{background:var(--mode-excl-bg);color:var(--mode-excl-fg);border-color:var(--danger-bd)}
#board{-webkit-backdrop-filter:var(--bf);backdrop-filter:var(--bf);display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));gap:var(--board-gap);width:min(100%,560px,calc(100vh - 300px));aspect-ratio:1;flex:none;background:var(--board-bg);padding:var(--board-gap);border-radius:var(--board-radius)}
.cell{background:var(--cell-bg);border:var(--bw) solid var(--cell-bd);border-radius:var(--cell-radius);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));padding:2% 0;position:relative;min-width:0;min-height:0;overflow:hidden}
.cell.def{display:block;padding:0;background:var(--cell-def-bg)}
.cell.def .tile{width:100%;height:100%;padding:12%;border-radius:var(--cell-radius);border:0;box-shadow:inset 0 0 0 var(--tile-def-ring) var(--rc)}
.cell.err{outline:3px solid var(--cell-err);outline-offset:-3px}
.slot{display:flex;align-items:center;justify-content:center;min-width:0;min-height:0}
.slot svg.g{width:84%;height:auto;max-width:24px;max-height:100%;aspect-ratio:1;opacity:var(--slot-opacity);pointer-events:none}
/* clues */
#hints{flex:1;width:min(100%,560px,calc(100vh - 300px));max-width:560px;overflow-y:auto;margin-top:8px;padding:4px 0 12px;-webkit-overflow-scrolling:touch}
.hgrp{display:flex;flex-wrap:wrap;gap:3px;align-items:flex-start;align-content:flex-start;justify-content:flex-start}
/* three-cell clues: columns of the width of one clue, the free width shared between the columns (first clue on the left edge, last one on the right edge, same columns on the last row) */
.hgrp[data-kind="H"]{display:grid;grid-template-columns:repeat(auto-fill,calc(3*var(--hi) + 2px + 2*var(--bw)));justify-content:space-between;column-gap:3px;row-gap:3px}
.hgrp[data-kind="H"] .hint{justify-self:start}
.hgrp+.hgrp{margin-top:8px;padding-top:8px;border-top:1px solid var(--hint-sep)}
.hint{display:flex;border-radius:var(--hint-radius);padding:1px;background:var(--hint-bg);border:var(--bw) solid var(--hint-bd);cursor:pointer}
.hint.v{flex-direction:column}
.hint .tile{width:var(--hi);height:var(--hi);padding:3%;background:transparent;border:0;box-shadow:none;border-radius:3px}
.hint .tile.sym{--rc:var(--hint-sym)}
.hint.done{opacity:var(--done-opacity);filter:grayscale(1)}
.hint{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.hgrp.lifting{outline:2px dashed var(--acc);outline-offset:3px;border-radius:6px}
.hint.lifted{outline:3px solid var(--acc);outline-offset:1px;transform:scale(1.08);box-shadow:0 4px 12px rgba(0,0,0,.28);position:relative;z-index:1}
/* cell zoom: panel in place of the clues; the board stays active */
#zoom{display:none;flex:1;min-height:0;width:100%;max-width:560px;margin-top:8px;padding-bottom:12px}
#zoom.on{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px}
#zcap b{font-weight:700;color:var(--fg)}
#gcap{flex:none;width:100%;max-width:560px;font-size:.82rem;color:var(--muted);text-align:center;line-height:1.25;padding:8px 8px 10px;border-top:1px solid var(--rule)}
#gcap b{font-weight:700;color:var(--fg)}
.zooming #gcap{display:none}
#zcap{flex:none;font-size:.82rem;color:var(--muted);text-align:center;line-height:1.25;padding:0 8px}
.zooming #hints{display:none}
#zrow{display:flex;align-items:stretch;gap:10px}
#zrow.lefty{flex-direction:row-reverse}
#zbox{-webkit-backdrop-filter:var(--bf);backdrop-filter:var(--bf);flex:none;width:min(100%,440px);aspect-ratio:3/2;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:8px;background:var(--zoom-bg);border-radius:var(--zoom-radius);padding:10px;box-shadow:0 0 0 2px var(--zoom-frame),var(--zoom-shadow)}
.zslot{display:flex;align-items:center;justify-content:center;min-width:0;min-height:0}
.zslot .tile{width:100%;height:100%;padding:14%;transition:transform .08s}
.zslot.pr .tile{transform:scale(.92)}
#zbtns{display:flex;flex-direction:column;gap:8px;width:var(--zbw,64px);flex:none}
#zbtns button{flex:1;min-height:0;padding:0;display:flex;align-items:center;justify-content:center;border-radius:14px}
#zbtns .ic{width:56%;height:auto;max-height:70%;stroke-width:var(--icon-stroke-big)}
#z-close{color:var(--acc)}
.cell.zsel{box-shadow:inset 0 0 0 3px var(--zoom-frame)}
.helplink a{color:var(--acc);text-decoration:underline}
/* column mode: selected columns, working row, tiles that cannot be excluded from every column */
.cell.crow:not(.csel){box-shadow:inset 0 0 0 2px var(--rule)}
.cell.csel{box-shadow:inset 0 0 0 3px var(--acc)}
.cell.csel:not(.crow){filter:grayscale(1);opacity:.5}      /* selected column, other rows: greyed */
.cell.csel.crow{box-shadow:inset 0 0 0 6px var(--acc)}
.zslot.dis .tile{opacity:.22;filter:grayscale(1)}
/* reading direction: the whole game keeps left→right order ("left of" clues, columns, hand) even in Arabic */
.bar,#board,#hints,#zoom,.ex .tiles{direction:ltr}
.statsbar{display:flex;gap:8px;margin-top:6px}
.statsbar button{flex:1;margin-top:0;padding:10px 6px}
select#opt-lang{width:100%;font:inherit;font-size:1rem;color:var(--btn-fg);background:var(--btn-bg);border:var(--bw) solid var(--btn-bd);border-radius:var(--btn-radius);padding:12px 10px}
/* options */
.optrow{margin:14px 0 18px}
.optrow h3{margin:0 0 8px;font-size:1rem;font-weight:600;color:var(--fg)}
.seg{display:flex;gap:0;border:var(--bw) solid var(--btn-bd);border-radius:var(--btn-radius);overflow:hidden;background:var(--btn-bg)}
.text .seg button{flex:1;margin:0;border:0;border-radius:0;background:transparent;padding:12px 8px;font-size:1rem;color:var(--btn-fg)}
.text .seg button+button{border-left:var(--bw) solid var(--btn-bd)}
.text .seg button.on{background:var(--acc);color:var(--bg);font-weight:600}
/* texts */
.text{align-items:stretch;overflow-y:auto;max-width:560px;margin:0 auto;padding-bottom:24px}
.text h2{color:var(--acc);font-weight:700}
.text p,.text li{line-height:1.45;text-align:justify;hyphens:auto;-webkit-hyphens:auto}
.text button{margin-top:12px}
.text .ex{display:flex;align-items:center;gap:8px;margin:6px 0}
.text .ex .tiles{display:flex;gap:4px;flex:none}
.text .ex .tile{width:34px;height:34px;flex:none;padding:4px}
.text .ex .tile.sym{--rc:var(--hint-sym)}
.danger{background:var(--danger-bg);color:var(--danger-fg);border-color:var(--danger-bd)}
table{width:100%;border-collapse:collapse;margin:8px 0}
td,th{padding:6px 4px;border-bottom:1px solid var(--rule);text-align:left}
td:last-child,th:last-child{text-align:end}
/* dialog and message */
/* accessibility: text for screen readers only, visible keyboard focus */
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.cell:focus-visible,.zslot:focus-visible,.hint:focus-visible{outline:3px solid var(--acc);outline-offset:-3px}
.hint:focus-visible{outline-offset:2px}
#dialog{position:fixed;inset:0;background:var(--dialog-veil);display:flex;align-items:center;justify-content:center;z-index:9}
#dialog[hidden],#toast[hidden]{display:none}
.box{-webkit-backdrop-filter:var(--bf);backdrop-filter:var(--bf);background:var(--dialog-bg);border:var(--bw) solid var(--dialog-bd);border-radius:16px;padding:20px;max-width:min(88vw,380px);text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.2)}
.box p{margin:0 0 16px;font-size:1.1rem;line-height:1.4;white-space:pre-line}
#d-btns{display:flex;gap:10px;justify-content:center}
#d-btns.col{flex-direction:column;align-items:stretch}
#d-btns.row button{flex:1 1 0;min-width:0}
#d-btns button{font-size:1.1rem;padding:12px 16px}
.box{min-width:min(78vw,300px)}
#d-field{width:100%;box-sizing:border-box;margin:0 0 14px;padding:12px;font:1.25rem/1.2 ui-monospace,Consolas,monospace;letter-spacing:.08em;text-align:center;text-transform:uppercase;color:var(--fg);background:var(--cell-bg);border:var(--bw) solid var(--btn-bd);border-radius:var(--btn-radius)}
#d-field[hidden],#d-err[hidden]{display:none}
.box p#d-err{margin:-6px 0 14px;font-size:.95rem;color:var(--danger-fg)}
#g-info{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;line-height:1.1;min-width:0}
.bar #g-code{display:block;background:none;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;padding:3px 0 0;min-width:0;min-height:0;font:600 .64rem/1 ui-monospace,Consolas,monospace;letter-spacing:.05em;color:var(--muted);cursor:pointer;text-align:left}
.bar #g-code[hidden]{display:none}
.bar #g-level{display:block;padding:2px 0 0;font:600 .64rem/1 system-ui,sans-serif;letter-spacing:.04em;color:var(--muted)}
.bar #g-level[hidden]{display:none}
td.cd{font:.72rem ui-monospace,Consolas,monospace;color:var(--muted);text-align:end}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--toast-bg);color:var(--toast-fg);border-radius:10px;padding:10px 16px;z-index:10;max-width:90vw;text-align:center}
@media (min-width:700px){:root{--hi:36px}}
</style>
</head>
<body>

<section id="s-home" class="screen">
  <canvas id="logo" role="img" data-i18n-aria="logo.alt"></canvas>
  <h1 id="title" role="img" aria-label="1-5731N"><svg class="tg" viewBox="6 6 36 36" aria-hidden="true"><use href="#t-1"/></svg><svg class="tg" viewBox="6 6 36 36" aria-hidden="true"><use href="#t-minus"/></svg><svg class="tg" viewBox="6 6 36 36" aria-hidden="true"><use href="#t-5"/></svg><svg class="tg" viewBox="6 6 36 36" aria-hidden="true"><use href="#t-plus"/></svg><svg class="tg" viewBox="6 6 36 36" aria-hidden="true"><use href="#t-3"/></svg><svg class="tg" viewBox="6 6 36 36" aria-hidden="true"><use href="#t-1"/></svg><svg class="tg" viewBox="6 6 36 36" aria-hidden="true"><use href="#t-IV"/></svg></h1>

  </nav>
  <p class="foot"><span id="ver"></span><br><span data-i18n-html="foot.inspired"></span></p>

    <button id="z-hand" data-i18n-aria="tt.hand" data-i18n-title="tt.hand"></button>
  </div></div><div id="zcap"></div></div>
</section>

<section id="s-help" class="screen text">

<section id="s-options" class="screen text">

  <input type="file" id="pack-file" accept="application/json,.json" hidden>

<div id="dialog" hidden role="dialog" aria-modal="true" aria-labelledby="d-text"><div class="box"><p id="d-text"></p><input id="d-field" hidden type="text" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="12" enterkeyhint="go"><p id="d-err" role="alert" hidden></p><div id="d-btns"></div></div></div>
